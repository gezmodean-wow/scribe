services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
      POSTGRES_DB: scribe
    ports:
      - '5432:5432'
    volumes:
      - scribe-pg-data:/var/lib/postgresql/data

volumes:
  scribe-pg-data:
